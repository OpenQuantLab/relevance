# Nginx config for datavik.no – add this inside your server block
# or include it from the main nginx config.
#
# If you already have a server block for datavik.no, just add the
# location block below. Otherwise use the full example.

server {
    listen 80;
    server_name datavik.no www.datavik.no;

    # Redirect HTTP → HTTPS (uncomment if you have TLS)
    # return 301 https://$host$request_uri;

    # -- Relevance app --
    location /projects/relevance/ {
        proxy_pass http://127.0.0.1:8050/projects/relevance/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Dash hot-reload / callbacks)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    # Add other /projects/* locations here as needed
}

# If you use HTTPS (recommended), duplicate the location block
# inside your port-443 server block:
